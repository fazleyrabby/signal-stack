version: "3.9"

services:

  frontend:
    image: node:20-alpine
    container_name: signalstack-frontend-dev
    working_dir: /app
    # Add build tools for any native dependencies and ensure next is in PATH
    command: >
      sh -c "apk add --no-cache python3 make g++ && 
             npm install --legacy-peer-deps && 
             npx next dev -p 3001"
    volumes:
      - ./frontend:/app
      - node_modules_frontend:/app/node_modules
    environment:
      NODE_ENV: development
      PORT: 3001
      NEXT_PUBLIC_API_URL: http://localhost:3000
      API_BACKEND_URL: http://signalstack-app:3000
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    ports:
      - "3001:3001"

  app:
    image: node:20-alpine
    container_name: signalstack-app-dev
    working_dir: /app
    # Fix script to start:dev and add build tools for bcrypt/pg
    command: >
      sh -c "apk add --no-cache postgresql-client python3 make g++ && 
             npm install && 
             npm run start:dev"
    volumes:
      - ./backend:/app
      - node_modules_backend:/app/node_modules
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://signal:signal@postgres:5432/signalstack
      REDIS_HOST: redis
      REDIS_PORT: 6379
      LOCAL_AI_ENABLED: ${LOCAL_AI_ENABLED:-true}
      LOCAL_AI_URL: http://llama:8080

  llama:
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  drizzle-studio:
    image: node:20-alpine
    container_name: signalstack-drizzle-studio
    working_dir: /app
    command: sh -c "npm install --legacy-peer-deps && npx drizzle-kit studio --host 0.0.0.0 --port 4983"
    volumes:
      - ./backend:/app
      - node_modules_backend:/app/node_modules
    environment:
      DATABASE_URL: postgresql://signal:signal@postgres:5432/signalstack
    ports:
      - "127.0.0.1:4983:4983"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  node_modules_frontend:
  node_modules_backend:


