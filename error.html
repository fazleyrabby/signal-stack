<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SignalStack - Down</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f0f23;
      font-family: system-ui, sans-serif;
      color: #fff;
    }
    .container { text-align: center; padding: 2rem; }
    h1 { font-size: 2rem; margin-bottom: 1rem; }
    p { color: #888; margin-bottom: 2rem; }
    .status {
      display: inline-block;
      padding: 0.5rem 1rem;
      background: #22c55e;
      color: #000;
      border-radius: 9999px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>SignalStack</h1>
    <p>Site is temporarily down for maintenance.</p>
    <span class="status">Will be back soon</span>
  </div>
</body>
</html>
