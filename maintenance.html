<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SignalStack - Taking a Nap 😴</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0f0f23 0%, #1a1a3e 50%, #0d0d1a 100%);
      font-family: 'Courier New', monospace;
      overflow: hidden;
    }
    
    .stars {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      background-image: 
        radial-gradient(2px 2px at 20px 30px, #fff, transparent),
        radial-gradient(2px 2px at 40px 70px, rgba(255,255,255,0.8), transparent),
        radial-gradient(1px 1px at 90px 40px, #fff, transparent),
        radial-gradient(2px 2px at 130px 80px, rgba(255,255,255,0.6), transparent),
        radial-gradient(1px 1px at 160px 120px, #fff, transparent);
      background-size: 200px 200px;
      animation: twinkle 4s ease-in-out infinite;
    }
    
    @keyframes twinkle {
      0%, 100% { opacity: 0.8; }
      50% { opacity: 0.4; }
    }
    
    .container {
      text-align: center;
      padding: 2rem;
      position: relative;
      z-index: 10;
    }
    
    .emoji {
      font-size: 8rem;
      animation: float 3s ease-in-out infinite;
      display: inline-block;
    }
    
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-20px); }
    }
    
    h1 {
      color: #fff;
      font-size: 2.5rem;
      margin: 1rem 0;
      text-shadow: 0 0 20px rgba(99, 102, 241, 0.5);
    }
    
    .subtitle {
      color: #a5b4fc;
      font-size: 1.2rem;
      margin-bottom: 2rem;
      max-width: 400px;
    }
    
    .progress-bar {
      width: 300px;
      height: 8px;
      background: rgba(255,255,255,0.1);
      border-radius: 4px;
      margin: 0 auto 2rem;
      overflow: hidden;
    }
    
    .progress {
      height: 100%;
      background: linear-gradient(90deg, #6366f1, #8b5cf6, #ec4899);
      border-radius: 4px;
      animation: progress 2s ease-in-out infinite;
    }
    
    @keyframes progress {
      0% { width: 0%; }
      50% { width: 70%; }
      100% { width: 100%; }
    }
    
    .status {
      color: #6366f1;
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 2px;
    }
    
    . ETA {
      color: #fbbf24;
      font-size: 1.5rem;
      margin-top: 1rem;
    }
    
    .social {
      margin-top: 3rem;
    }
    
    .social a {
      color: #6366f1;
      text-decoration: none;
      margin: 0 10px;
      font-size: 0.9rem;
      transition: color 0.3s;
    }
    
    .social a:hover { color: #fff; }
    
    .coffee {
      position: fixed;
      bottom: 20px;
      right: 20px;
      font-size: 2rem;
      animation: shake 0.5s ease-in-out infinite;
    }
    
    @keyframes shake {
      0%, 100% { transform: rotate(-5deg); }
      50% { transform: rotate(5deg); }
    }
  </style>
</head>
<body>
  <div class="stars"></div>
  
  <div class="container">
    <div class="emoji">😴</div>
    <h1>SignalStack</h1>
    <p class="subtitle">
      We're temporarily away. The robots are recharging their circuits and getting things ready for you!
    </p>
    
    <div class="progress-bar">
      <div class="progress"></div>
    </div>
    
    <p class="status">Something awesome is being prepared...</p>
    <p class="eta">Back in a bit! ✨</p>
    
    <div class="social">
      <a href="https://github.com/fazleyrabby/signal-stack">View Source</a>
      <a href="mailto:admin@signalstack.local">Contact</a>
    </div>
  </div>
  
  <div class="coffee">☕</div>
</body>
</html>
